<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="robots" content="noindex" />
  <title>Media search</title>
  <!-- window.CMS_REPO (and the other CMS_* globals) are injected into <head>
       at build by scripts/render-decap-config.rb and the theme gem's
       decap_config_hook.rb, like the other admin pages. The page's logic is
       media-search.js (same origin, shipped from theme/admin); where the
       results live is its DATA_SOURCE block. -->
  <style>
    :root {
      --bg: #faf9f7;
      --surface: #ffffff;
      --text: #231f1c;
      --muted: #6a625b;
      --line: #e8e3dd;
      --accent: #2f5d50;
      --accent-text: #ffffff;
      --ok-bg: #e4f1ea;
      --ok-text: #1d5a3c;
      --look-bg: #fbefd5;
      --look-text: #7a4b00;
      --focus: #1a5fd0;
      --shadow: 0 1px 2px rgba(35, 31, 28, 0.06), 0 6px 18px rgba(35, 31, 28, 0.05);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161412;
        --surface: #211e1b;
        --text: #f1ece6;
        --muted: #aaa196;
        --line: #35302b;
        --accent: #7fc4ac;
        --accent-text: #0f1f19;
        --ok-bg: #1c3a2c;
        --ok-text: #a8e0c3;
        --look-bg: #3d2f12;
        --look-text: #f2cf8a;
        --focus: #8db8ff;
        --shadow: none;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 1.0625rem/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .ms-wrap { max-width: 42rem; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
    .ms-back { display: inline-block; margin-bottom: 1.5rem; }
    h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 0.35rem; font-weight: 650; }
    .ms-searched { margin: 0 0 1.75rem; color: var(--muted); min-height: 1.55em; }
    a, .ms-link { color: var(--accent); text-underline-offset: 0.2em; }
    a:focus-visible, button:focus-visible, #ms-status:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
      border-radius: 6px;
    }
    #ms-status {
      margin: 0 0 1.25rem;
      padding: 0;
      min-height: 0;
    }
    #ms-status:not(:empty) {
      padding: 0.85rem 1rem;
      background: var(--ok-bg);
      color: var(--ok-text);
      border-radius: 12px;
    }
    #ms-status a { color: inherit; font-weight: 600; }
    .ms-tabs { display: flex; gap: 0.5rem; margin: 0 0 1.5rem; flex-wrap: wrap; }
    .ms-tab {
      font: inherit;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.55rem 1rem;
      min-height: 44px;
      cursor: pointer;
    }
    .ms-tab[aria-pressed="true"] { background: var(--surface); color: var(--text); border-color: var(--accent); font-weight: 600; }
    .ms-count { color: var(--muted); font-weight: 400; margin-left: 0.15rem; }
    .ms-list { display: grid; gap: 1.25rem; }
    .ms-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1.25rem;
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: max-height 0.4s ease, opacity 0.3s ease, transform 0.4s ease, padding 0.4s ease, margin 0.4s ease, border-width 0.4s ease;
    }
    .ms-card.ms-leaving {
      max-height: 0 !important;
      opacity: 0;
      transform: translateY(-8px);
      padding-top: 0;
      padding-bottom: 0;
      margin-top: -0.6rem;
      margin-bottom: -0.6rem;
      border-width: 0;
    }
    .ms-card-head { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
    .ms-kind { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .ms-badge { font-size: 0.85rem; font-weight: 600; padding: 0.2rem 0.7rem; border-radius: 999px; }
    .ms-ok { background: var(--ok-bg); color: var(--ok-text); }
    .ms-look { background: var(--look-bg); color: var(--look-text); }
    .ms-title { font-size: 1.25rem; line-height: 1.3; margin: 0.6rem 0 0.25rem; font-weight: 650; overflow-wrap: anywhere; }
    .ms-when { margin: 0.15rem 0; color: var(--muted); }
    .ms-open { margin: 0.6rem 0 0; }
    .ms-why { margin: 1rem 0 0; padding: 0.9rem 1rem; background: var(--bg); border-radius: 12px; }
    .ms-why-title { margin: 0 0 0.35rem; font-weight: 600; }
    .ms-why ul { margin: 0; padding-left: 1.2rem; }
    .ms-why li { margin: 0.3rem 0; }
    .ms-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1.25rem; }
    .ms-btn {
      font: inherit;
      font-weight: 600;
      border-radius: 12px;
      padding: 0.75rem 1.25rem;
      min-height: 48px;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .ms-primary { background: var(--accent); color: var(--accent-text); }
    .ms-secondary { background: transparent; color: var(--text); border-color: var(--line); }
    .ms-btn:disabled { opacity: 0.55; cursor: default; }
    @media (max-width: 30rem) {
      .ms-actions { flex-direction: column; }
      .ms-btn { width: 100%; }
    }
    .ms-empty { text-align: center; padding: 3.5rem 1rem; color: var(--muted); }
    .ms-empty-title { font-size: 1.3rem; color: var(--text); margin: 0 0 0.4rem; font-weight: 600; }
    .ms-empty-text { margin: 0; }
    .ms-center { text-align: center; padding: 3rem 0; }
    .ms-center .ms-btn { margin-top: 1rem; }
    .ms-link-btn { display: inline-block; text-decoration: none; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="ms-wrap" id="ms-app">
    <a class="ms-back ms-link" href="/admin/">&larr; Back to the website editor</a>
    <h1>Media search</h1>
    <p class="ms-searched" id="ms-searched"></p>

    <p id="ms-status" role="status" aria-live="polite" tabindex="-1"></p>

    <section id="ms-loading" aria-label="Loading">
      <p class="ms-center">Loading the latest finds&hellip;</p>
    </section>

    <section id="ms-signin" class="ms-center" hidden>
      <p><strong>Please sign in to the website editor first.</strong></p>
      <p>Once you're signed in, come back to this page.</p>
      <a class="ms-btn ms-primary ms-link-btn" href="/admin/">Go to the website editor</a>
    </section>

    <section id="ms-problem" class="ms-center" hidden>
      <p id="ms-problem-text"></p>
      <button type="button" class="ms-btn ms-secondary" id="ms-retry">Try again</button>
    </section>

    <section id="ms-main" hidden>
      <div class="ms-tabs" id="ms-tabs" role="group" aria-label="Show"></div>
      <div class="ms-list" id="ms-list"></div>
    </section>
  </div>
  <script src="media-search.js" defer></script>
</body>
</html>
