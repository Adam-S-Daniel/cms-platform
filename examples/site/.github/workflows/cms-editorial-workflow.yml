name: CMS Editorial Workflow
run-name: "${{ format('PR #{0} — {1}', github.event.pull_request.number, github.event.pull_request.title) }}"
on:
  pull_request:
    # auto_merge_disabled: re-arm when GitHub turns auto-merge off by itself
    # (cms-platform#1130); see the reusable's auto-merge-when-ready job.
    types: [opened, synchronize, labeled, auto_merge_disabled]
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  editorial:
    uses: Adam-S-Daniel/cms-platform/.github/workflows/cms-editorial-workflow.yml@v0.1.195
    with:
      # Pin to the SAME ref as the `uses:` pin above so the module matches.
      platform_ref: v0.1.195
    secrets:
      CMS_E2E_PAT: ${{ secrets.CMS_E2E_PAT }}
