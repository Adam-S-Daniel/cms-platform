# Thin caller — weekly pre-commit guard sync from the platform. Pin platform_ref to a tag.
# Delivers + keeps current the secrets-scan + lint-staged pre-commit guards (issue #116).
name: Dev-hooks sync
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    uses: Adam-S-Daniel/cms-platform/.github/workflows/dev-hooks-sync.yml@v0.1.102
    with:
      platform_ref: v0.1.102
    secrets:
      # So the sync PR triggers CI: the CMS automation App when provisioned
      # (vars.CMS_AUTOMATION_APP_ID + app_private_key), else the PAT (#238).
      gh_token: ${{ secrets.CMS_PLATFORM_PAT }}
      app_private_key: ${{ secrets.CMS_AUTOMATION_APP_PRIVATE_KEY }}
