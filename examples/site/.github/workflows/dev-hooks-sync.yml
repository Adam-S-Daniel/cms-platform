# Thin caller — weekly pre-commit guard sync from the platform. Pin platform_ref to a tag.
# Delivers + keeps current the secrets-scan + lint-staged pre-commit guards (issue #116).
name: Dev-hooks sync
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    uses: Adam-S-Daniel/cms-platform/.github/workflows/dev-hooks-sync.yml@v0.1.188
    with:
      platform_ref: v0.1.188
    secrets:
      # The CMS automation App's private key, with vars.CMS_AUTOMATION_APP_ID
      # set on this repo: the only credential that can open the sync PR (and
      # the PR then triggers this repo's CI). Without both the run fails with
      # an error naming them; GITHUB_TOKEN is not a fallback.
      app_private_key: ${{ secrets.CMS_AUTOMATION_APP_PRIVATE_KEY }}
