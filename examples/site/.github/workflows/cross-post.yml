# Thin caller — copied into a site repo as
# `.github/workflows/cross-post.yml`. Owns the push / workflow_dispatch
# triggers, the `paths:` fixture exclusion, and the run-name; delegates the
# actual detect/verify/render/post work to the platform's reusable workflow.
# Keep `platform_ref` equal to the `@vX.Y.Z` pin on the `uses:` line.
#
# SITE VALUES TO SET before this does anything beyond a no-op:
#   - `prod_url`          — this site's real production URL (no trailing
#                            slash). Required even before either leg is
#                            configured: it feeds `await-prod-deploy` on a
#                            push, so cross-post never runs against a stale
#                            pre-merge site once you DO turn a leg on.
#   - `mastodon_instance`  — e.g. https://hachyderm.io. Leave "" to skip the
#                            Mastodon leg.
#   - `substack: true`     — turns on rendering + uploading the Substack-ready
#                            Markdown draft (job summary + run artifact).
#                            Substack has no publish API, so posting it is
#                            always paste-by-hand.
#
# `secrets: MASTODON_ACCESS_TOKEN` — an app token scoped to `write:statuses`
# ONLY (see docs/CROSS-POSTING.md for how to mint one). Optional: with the
# secret unset, the Mastodon leg is skipped with an `::warning::` rather than
# failing the run.
#
# A SITE THAT LEAVES THE DEFAULTS ABOVE UNCHANGED gets a harmless no-op run
# on every post push: `cross-post.yml` prints one `::notice::` (cross-posting
# is not configured for this site) and does nothing else.
name: Cross-post
run-name: >-
  ${{ github.event_name == 'push'
        && format('push — {0} @{1}', github.ref_name, github.actor)
   || format('manual — @{0}', github.actor) }}

on:
  push:
    branches: [main]
    paths:
      - '_posts/**'
      # prod-loop canaries (test_fixture) — cross_post.py would skip these
      # anyway; excluding the paths here just saves the run.
      - '!_posts/2099-*'
      - '!_posts/*-e2e-*'
  workflow_dispatch:
    inputs:
      post_path:
        description: 'Path of one _posts/*.md to cross-post (backfill or re-run)'
        type: string
        required: true
      dry_run:
        description: 'Log what would be posted; post nothing'
        type: boolean
        default: true
      visibility:
        description: 'Mastodon post visibility'
        type: choice
        options: [public, unlisted, direct]
        default: public

permissions:
  contents: read

jobs:
  cross-post:
    uses: Adam-S-Daniel/cms-platform/.github/workflows/cross-post.yml@v0.1.108
    with:
      prod_url: https://example.com
      mastodon_instance: ""
      substack: false
      post_path: ${{ inputs.post_path || '' }}
      dry_run: ${{ inputs.dry_run || false }}
      visibility: ${{ inputs.visibility || 'public' }}
      platform_ref: v0.1.108
    secrets:
      MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
