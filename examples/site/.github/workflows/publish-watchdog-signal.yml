name: Publish watchdog signal
# Knocks the `Publish watchdog` sweep (a `repository_dispatch`) when a gating
# workflow fails or is cancelled on a same-repository `cms/` pull request, when
# the editorial workflow completes on one (Publish was pressed), and after a
# production deploy succeeds (so the sweep closes issues for changes that went
# live). Runs under `workflow_run`, a privileged trigger, so it holds a
# read-only token and passes nothing from the triggering run: the one credential
# is the CMS automation App (variable CMS_AUTOMATION_APP_ID + secret
# CMS_AUTOMATION_APP_PRIVATE_KEY). Without both it is a green no-op and the
# 6-hourly sweep still runs. The platform owns the logic; this thin caller needs
# no site-specific values.
run-name: >-
  ${{ format('signal — {0} {1}', github.event.workflow_run.name, github.event.workflow_run.conclusion) }}

on:
  workflow_run:
    workflows:
      - CMS Editorial Workflow
      - E2E Tests
      - Site verify
      - Parity (preview)
      - Preview Media Gate
      - Visual Regression
      - Secrets scan
      - Platform prerelease guard
      - agent-checks
      - Deploy to Production
    types: [completed]

permissions:
  contents: read

jobs:
  signal:
    # Fires for: a failed, timed-out, startup-failed or cancelled gating run on a
    # same-repository `cms/` pull request; ANY run of the editorial workflow on one
    # (it runs on every label, so its completion is the moment Publish is
    # pressed, including on a pull request whose checks already failed); and a
    # successful production deploy (so the sweep closes resolved issues).
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository
      && ((github.event.workflow_run.event == 'pull_request'
           && startsWith(github.event.workflow_run.head_branch, 'cms/')
           && (contains(fromJSON('["failure","timed_out","startup_failure","cancelled"]'), github.event.workflow_run.conclusion)
               || github.event.workflow_run.name == 'CMS Editorial Workflow'))
          || (github.event.workflow_run.name == 'Deploy to Production'
              && github.event.workflow_run.conclusion == 'success'))
    uses: Adam-S-Daniel/cms-platform/.github/workflows/publish-watchdog-signal.yml@v0.1.182
    secrets:
      # The CMS automation App's private key, with vars.CMS_AUTOMATION_APP_ID
      # set on this repo. Named explicitly, never a blanket secrets pass-through.
      app_private_key: ${{ secrets.CMS_AUTOMATION_APP_PRIVATE_KEY }}
