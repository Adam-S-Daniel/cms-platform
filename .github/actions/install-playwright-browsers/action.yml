name: Install Playwright browsers
description: >-
  `npx playwright install` for one engine, BOUNDED and RETRIED.

  WHY THIS EXISTS (measured, adamdaniel.ai run 31177527405 job
  92862768030). `--with-deps` runs `apt-get install` for ~90 system
  packages before it downloads the browser. On 2026-08-07 the Ubuntu
  archive mirror served that job at ~35 KB/s for the WHOLE run — every
  package fetch stalling 86-391 s — so `install --with-deps webkit` took
  39 MINUTES instead of its usual ~60 s. The tests themselves then ran
  in 41.6 s. Nothing was broken; the mirror was slow, and the install
  had no upper bound.

  That was expensive because of what waits on it. The e2e matrix's
  aggregating `e2e` gate waits for EVERY project job, so one stalled
  lane sets the whole PR's critical path — and a `cms/*` canary PR that
  can't merge until `e2e / e2e` reports blocks the prod loop that opened
  it. That run's 39-minute lane held delete-recovery PR #2953 for 40
  minutes and failed the media-roundtrip loop's 30-minute delete-leg
  budget. Ten lanes take ten INDEPENDENT apt exposures per run, so the
  chance a run hits one is roughly ten times a single lane's.

  The fix is a bound plus a retry, not just a bound: a bare
  `timeout-minutes:` would turn "slow mirror" into a RED required check,
  which blocks a canary PR permanently instead of merging it late. A
  fresh attempt gets fresh connections (azure.archive.ubuntu.com is
  load-balanced), which is what actually recovers a collapsed transfer —
  apt's own `Acquire::*::Timeout` does not, because the bytes were
  flowing, just slowly.

  Typical runs are unaffected: the timeout is a ~7x margin over the
  normal ~60 s install, so it never trips on a healthy mirror.

  Bash only — no transitive `uses:` (clean for the SHA-pin convention;
  mirrors await-prod-deploy / cms-recursion-gate).

inputs:
  browser:
    description: >-
      ONE engine to install — `chromium`, `firefox` or `webkit`. Not a list:
      the value is passed to `npx playwright` as a single quoted argument, so
      "chromium firefox" would be handed over as one bogus engine name. Must
      already be resolved (this action does not read playwright.config.js);
      e2e-tests.yml derives it from `node ci-matrix.js --engine "$PW_PROJECT"`.
    required: false
    default: chromium
  working-directory:
    description: "Directory holding the harness's node_modules (where `npx playwright` resolves)."
    required: false
    default: .cms-platform/e2e
  deps-only:
    description: >-
      'true' runs `install-deps` (the apt half only) instead of
      `install --with-deps` — for a lane that restored the browser
      binaries from cache and needs just the OS libraries.
    required: false
    default: 'false'
  apt-lock-timeout-seconds:
    description: >-
      How long apt may WAIT for the dpkg frontend lock before giving up. Set as an
      apt.conf.d drop-in so it also applies to the apt-get inside
      `playwright install --with-deps`, which this action does not invoke directly.
      300 s comfortably outlasts a runner's boot-time unattended-upgrades pass.
    required: false
    default: '300'
  attempts:
    description: "How many times to try before failing the step."
    required: false
    default: '3'
  timeout-seconds:
    description: >-
      Bound for every attempt EXCEPT the last. Default 420 s is ~7x the normal
      ~60 s install, so a healthy run never hits it — it exists to abandon a
      stalled connection quickly and try a fresh one.
    required: false
    default: '420'
  final-timeout-seconds:
    description: >-
      Bound for the LAST attempt, deliberately much larger.

      WHY THE LAST ATTEMPT IS DIFFERENT. A uniform 420 s bound has a failure mode
      that is WORSE than the stall it fixes: when the mirror is slow for the whole
      run — which is exactly what was measured (~35 KB/s sustained, 2340 s to
      finish) — all three attempts hit the bound and the step exits 1. That turns a
      slow-but-GREEN run into a RED required check, which blocks a `cms/*` canary
      PR permanently instead of merging it late; the very outcome the retry was
      added to avoid. apt and `playwright install` both resume (completed .debs
      stay in /var/cache/apt/archives, downloaded engines in ~/.cache/ms-playwright),
      so each attempt makes real progress — the last one just needs room to finish.

      Default 1200 s ⇒ worst case 420 + 420 + 1200 = 34 min. **A caller whose job
      `timeout-minutes` is smaller than that MUST pass smaller values**, or the job
      is killed mid-retry and the run reports an opaque "job timed out" instead of
      this action's diagnostic. Locked by e2e/playwright-install-bounded.test.js,
      which fails if any caller's worst case exceeds its own job budget.
    required: false
    default: '1200'

runs:
  using: composite
  steps:
    # apt must WAIT for the dpkg lock, not fail on it. A GitHub-hosted runner runs
    # its own background apt (unattended-upgrades / apt-daily) for the first minute
    # or so after boot, and `playwright install --with-deps` shells out to apt-get
    # itself — so it races that holder and dies with exit 100:
    #
    #   E: Could not get lock /var/lib/dpkg/lock-frontend. It is held by process 2967 (apt-get)
    #
    # Measured live (adamdaniel.ai job 92892148211): that failed the webkit-iphone16
    # lane, which failed the aggregating `e2e` gate, which BLOCKED the host loop's
    # canary PR — and the loop then timed out waiting for a merge that could never
    # happen. Retrying does NOT help here: the attempts were back-to-back, so all
    # three landed inside the same lock window.
    #
    # apt >= 2.0 (Ubuntu 24.04 ships 2.7) can wait for the lock instead of erroring,
    # and an apt.conf.d drop-in applies it to apt invocations we do not control —
    # which is the only way to reach the one inside `playwright install`.
    # Fail-open: if we cannot write the drop-in we still try the install.
    - name: Let apt wait for the dpkg lock instead of failing
      shell: bash
      env:
        PW_APT_LOCK_TIMEOUT_S: ${{ inputs.apt-lock-timeout-seconds }}
      run: |
        set -uo pipefail
        conf=/etc/apt/apt.conf.d/99-playwright-install-lock-timeout
        line="DPkg::Lock::Timeout \"${PW_APT_LOCK_TIMEOUT_S}\";"
        if [ -w /etc/apt/apt.conf.d ]; then
          printf '%s\n' "$line" > "$conf" && echo "apt will wait up to ${PW_APT_LOCK_TIMEOUT_S}s for the dpkg lock."
        elif command -v sudo >/dev/null 2>&1; then
          printf '%s\n' "$line" | sudo tee "$conf" >/dev/null \
            && echo "apt will wait up to ${PW_APT_LOCK_TIMEOUT_S}s for the dpkg lock." \
            || echo "::warning::could not write ${conf}; a dpkg-lock race can still fail the install."
        else
          echo "::warning::no write access to /etc/apt/apt.conf.d and no sudo; a dpkg-lock race can still fail the install."
        fi

    - name: Install Playwright browser + system deps (bounded, retried)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PW_INSTALL_BROWSER: ${{ inputs.browser }}
        PW_INSTALL_DEPS_ONLY: ${{ inputs.deps-only }}
        PW_INSTALL_ATTEMPTS: ${{ inputs.attempts }}
        PW_INSTALL_TIMEOUT_S: ${{ inputs.timeout-seconds }}
        PW_INSTALL_FINAL_TIMEOUT_S: ${{ inputs.final-timeout-seconds }}
        PW_APT_LOCK_TIMEOUT_S: ${{ inputs.apt-lock-timeout-seconds }}
      run: |
        set -uo pipefail
        # Inputs come through env, never interpolated into the command —
        # the rendered `run:` is echoed to a public log (AGENTS.md).
        if [ "$PW_INSTALL_DEPS_ONLY" = "true" ]; then
          set -- install-deps "$PW_INSTALL_BROWSER"
        else
          set -- install --with-deps "$PW_INSTALL_BROWSER"
        fi
        echo "playwright $* (attempts=${PW_INSTALL_ATTEMPTS}, bound=${PW_INSTALL_TIMEOUT_S}s," \
             "final attempt ${PW_INSTALL_FINAL_TIMEOUT_S}s)"

        attempt=1
        while :; do
          # `timeout` kills the whole install — apt AND the CDN download —
          # so a collapsed transfer at either end is bounded. Both halves
          # are idempotent, so a retry resumes rather than redoes.
          #
          # Capture the status with `|| status=$?`, NOT `if …; fi` then `$?`:
          # after a `fi` with no else branch, `$?` is the IF STATEMENT's
          # status (0), not the command's, so the log would report every
          # failure as "exit 0".
          # The LAST attempt gets the generous bound: early attempts exist to
          # abandon a stalled connection fast, the final one to actually finish
          # on a mirror that is simply slow (see final-timeout-seconds).
          if [ "$attempt" -ge "$PW_INSTALL_ATTEMPTS" ]; then
            bound="$PW_INSTALL_FINAL_TIMEOUT_S"
          else
            bound="$PW_INSTALL_TIMEOUT_S"
          fi
          status=0
          timeout "$bound" npx playwright "$@" || status=$?
          if [ "$status" -eq 0 ]; then
            echo "playwright install succeeded on attempt ${attempt}."
            exit 0
          fi
          if [ "$attempt" -ge "$PW_INSTALL_ATTEMPTS" ]; then
            case "$status" in
              124) why="even the final ${PW_INSTALL_FINAL_TIMEOUT_S}s attempt was too slow to finish — a genuinely unusable mirror; re-run the job." ;;
              100) why="apt itself failed. If the log says 'Could not get lock /var/lib/dpkg/lock-frontend', the runner's own apt-daily held it longer than the ${PW_APT_LOCK_TIMEOUT_S}s this action tells apt to wait — raise apt-lock-timeout-seconds. Otherwise it is a real package/mirror error." ;;
              *)   why="a real install failure (not a timeout, not an apt lock)." ;;
            esac
            echo "::error::playwright install failed ${PW_INSTALL_ATTEMPTS} time(s) (last exit ${status}): ${why}"
            exit 1
          fi
          # 124 is `timeout`'s "killed at the bound" code; anything else is
          # a genuine failure that a retry may still ride out (a transient
          # apt/dpkg error, a CDN 5xx). Back off before retrying — an immediate
          # retry lands inside the same bad window, which is exactly how three
          # back-to-back attempts all hit one dpkg-lock holder (job 92892148211).
          backoff=$((attempt * 15))
          echo "::warning::playwright install attempt ${attempt} of ${PW_INSTALL_ATTEMPTS} gave up (exit ${status}" \
               "$([ "$status" = "124" ] && echo "— hit the ${bound}s bound" || echo "— install error"));" \
               "retrying in ${backoff}s with fresh connections (apt and playwright both resume," \
               "so progress is kept)."
          sleep "$backoff"
          attempt=$((attempt + 1))
        done
