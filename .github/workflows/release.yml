# Cut a cms-platform release.
#
# Releases are the platform's down-sync trigger: platform-bump.yml reads
# `gh api repos/<repo>/releases/latest` (the latest RELEASE, not a bare tag)
# to bump each site's platform_ref + platform.lock + the `uses:@<tag>` pins +
# the theme gem, all atomically — Dependabot ignores every cms-platform ref in
# both the github-actions (#244) and bundler (#242) ecosystems, so it never
# touches these. Cutting was previously a manual `git tag` / UI step; this
# makes it a one-click workflow_dispatch that creates the tag + GitHub Release
# server-side from the current main HEAD.
name: Cut release
run-name: "${{ format('cut {0} — @{1}', inputs.version, github.actor) }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to cut (vX.Y.Z). Tags the dispatched ref + creates a GitHub Release.'
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Needed only by the manifest-version guard inside the next step — the
      # release itself is cut server-side by `gh`, which needs no worktree.
      - name: Check out the ref being tagged
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (2026-07-17)

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ github.sha }}
          GH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # Releases are the down-sync trigger: platform-bump fans the LATEST
          # release out to every consuming site. workflow_dispatch lets the
          # operator pick any branch in the "Use workflow from" dropdown, and
          # github.sha then points at THAT ref's HEAD — so without this guard a
          # feature branch could be tagged + released as "latest" and bumped
          # into every site. Enforce the header's "from main HEAD" invariant
          # rather than leaving it a convention.
          if [ "$GH_REF" != "refs/heads/main" ]; then
            echo "::error::releases must be cut from main (dispatched ref: ${GH_REF}). Re-run with 'main' selected in the branch dropdown."
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must look like vX.Y.Z (got '${VERSION}')"
            exit 1
          fi
          if gh release view "$VERSION" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "::error::release ${VERSION} already exists"
            exit 1
          fi
          # The two plugin manifests carry this version as well — Claude Code
          # reads .claude-plugin/plugin.json, the Agent Plugins conformant
          # clients (Codex/VS Code/Cursor/Copilot) read the root plugin.json —
          # and until v0.1.83 NOTHING kept them in step with the tag, which is
          # how they shipped declaring 0.1.82 in the very release that
          # introduced them. This job cannot rewrite-and-push them either:
          # `main` is PR-only by ruleset, so a release-time commit would be
          # rejected (GH013). So the release REFUSES to cut a tag the manifests
          # disagree with, which puts the bump in the release PR — reviewed,
          # atomic with AGENTS.md, docs/VERSION-HISTORY.md and the two pin
          # surfaces the error below names — instead of in a step that can
          # silently skew. e2e/plugin-manifests.test.js separately locks the two
          # manifests to EACH OTHER; this locks them to the TAG.
          #
          # The message below is one of only two enumerations of the release
          # PR's edit set (AGENTS.md's release paragraph is the other). Keep them
          # complete: a releaser who fixes exactly what this names and no more
          # cuts the tag and THEN reds the required node-unit-lints lane, which
          # is the worst possible moment to discover a missing edit.
          expected="${VERSION#v}"
          skew=0
          for manifest in plugin.json .claude-plugin/plugin.json; do
            declared=$(jq -r '.version // ""' "$manifest")
            if [ "$declared" != "$expected" ]; then
              echo "::error file=${manifest}::${manifest} declares version '${declared}' but this run cuts ${VERSION} (expected '${expected}'). The release PR bumps ALL of: both plugin manifests, AGENTS.md's 'Current release:' line, every platform pin in examples/site/.github/workflows (uses:@ref AND with: platform_ref:), and scaffold/create-site.js's PLATFORM_VERSION — the last two enforced by e2e/examples-site-pins-current.test.js in the REQUIRED node-unit-lints lane, so skipping them reds self-CI right after the tag is cut. Fix them all, then re-dispatch."
              skew=1
            fi
          done
          if [ "$skew" -ne 0 ]; then
            exit 1
          fi
          gh release create "$VERSION" \
            --repo "$GH_REPO" \
            --target "$TARGET" \
            --title "$VERSION" \
            --generate-notes
          echo "::notice::Cut ${VERSION} at ${TARGET}. platform-bump + Dependabot will fan it out to consuming sites."

      # Chained down-sync: dispatch each consumer's platform-bump the moment
      # the release exists, instead of waiting for its weekly cron (Mondays
      # 07:00 UTC — up to six days of latency between "decided" and "bump PR
      # exists"). Reuses the cron's exact entry point (`workflow_dispatch` on
      # the consumer's platform-bump.yml caller), so consumers need no changes.
      #
      # FAIL-OPEN by design: a missing/expired token or a failed dispatch
      # degrades to exactly the pre-chaining behavior (the cron picks the
      # release up) — warnings, never a job failure. Fine-grained PATs are
      # minted per RESOURCE OWNER, so each consumer owner supplies its own
      # secret: Actions read+write on that one repo, nothing else.
      - name: Fan out bump dispatches to consumers
        env:
          VERSION: ${{ inputs.version }}
          TOKEN_ADAMDANIEL_AI: ${{ secrets.BUMP_DISPATCH_ADAMDANIEL_AI }}
          TOKEN_JODIDANIEL_COM: ${{ secrets.BUMP_DISPATCH_JODIDANIEL_COM }}
        run: |
          set -euo pipefail
          dispatch() {
            repo="$1" token="$2"
            if [ -z "$token" ]; then
              echo "::warning::no bump-dispatch token for ${repo} — its weekly platform-bump cron will pick up ${VERSION}."
              return 0
            fi
            if GH_TOKEN="$token" gh workflow run platform-bump.yml -R "$repo"; then
              echo "::notice::dispatched platform-bump in ${repo} for ${VERSION}."
            else
              echo "::warning::platform-bump dispatch failed for ${repo} — its weekly cron will pick up ${VERSION}."
            fi
          }
          dispatch "Adam-S-Daniel/adamdaniel.ai"   "$TOKEN_ADAMDANIEL_AI"
          dispatch "jodidaniel/jodidaniel.com"     "$TOKEN_JODIDANIEL_COM"
