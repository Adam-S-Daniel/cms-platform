# Self-caller: dogfood the dependabot-comment-sync reusable on cms-platform's
# OWN Dependabot PRs. The platform shipped this reusable to consumers but never
# ran it on itself, so ITS OWN action-pin comments drifted: #179 moves
# actions/setup-node to v7.0.0's SHA across 18 files while every comment still
# reads "# v6.4.0 (2026-04-20)", and #194's SHA is v6.2.3 behind a comment that
# says "# v6.1.1 (2026-05-05)" — stale by TWO releases. A repo whose whole
# convention is "the SHA and the comment stay in lockstep" has to run the
# lockstep-keeper on itself.
#
# Modeled on examples/site/.github/workflows/dependabot-comment-sync.yml (the
# consumer thin caller) — same triggers, same `paths:` filter, same clean-skip
# posture — but it calls the LOCAL reusable, so the sync script comes from THIS
# repo. `platform_repo` / `platform_ref` are deliberately not passed: their
# defaults already resolve to Adam-S-Daniel/cms-platform, i.e. this repo (the
# sibling self-* callers pass no platform pin either).
#
# SECURITY: the `pull_request_target` posture is the reusable's — the executed
# script is platform-authoritative, the Dependabot-only gate runs at the
# reusable's first step, and GitHub ignores PR edits to THIS file
# (pull_request_target always runs the base-ref version). Don't add an
# untrusted-PR-head checkout here.
name: Self dependabot comment sync

# Dynamic per-run title (issue #1776 grammar; enforced by
# e2e/workflow-run-name.test.js). Three events, so the run-name branches on
# `github.event_name`. The `>-` block scalar keeps the `#` in `PR #{0}`
# literal content (a single-line unquoted `#` would be a YAML comment).
run-name: >-
  ${{ github.event_name == 'pull_request_target'
        && format('PR #{0} — {1}', github.event.pull_request.number, github.event.pull_request.title)
   || github.event_name == 'push'
        && format('push — {0} @{1}', github.ref_name, github.actor)
   || format('manual — @{0}', github.actor) }}

on:
  # `workflow_dispatch` is here for manual debugging — re-run the sync
  # against a Dependabot PR head when investigating why its action-pin
  # comments weren't refreshed.
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/**'
  # `push` to every branch suppresses GitHub Actions' phantom failure
  # runs: without a `push:` trigger, GHA records a phantom
  # `event=push`/`conclusion=failure`/zero-jobs run on every push. A real
  # push handler that skips cleanly at the reusable's first step replaces
  # the phantom red rows with a real ~5 second `success` run.
  push:
    branches: ['**']

permissions:
  contents: write
  pull-requests: read

jobs:
  sync:
    uses: ./.github/workflows/dependabot-comment-sync.yml
    secrets:
      # cms-platform has no CMS_PLATFORM_PAT of its own today (that secret
      # lives in the CONSUMERS, whose callers pass it) — an unset secret
      # arrives as an empty string, so this line is harmless and keeps the
      # call interface identical to the consumer template. The App pair is
      # what this repo actually runs on: the private key is a secret, and
      # the App ID is read by the reusable from this repo's
      # `vars.CMS_AUTOMATION_APP_ID` variable.
      workflow_sha_comment_pat: ${{ secrets.CMS_PLATFORM_PAT }}
      app_private_key: ${{ secrets.CMS_AUTOMATION_APP_PRIVATE_KEY }}
