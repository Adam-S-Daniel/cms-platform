# Site verify (reusable) — run a consumer's OWN post-build verifier in CI.
#
# THE GAP (#377). jodidaniel.com ships `scripts/verify-build-artifacts.rb`, a
# pure-Ruby check over the BUILT site: media links resolve, the three-way
# category triangle agrees, the admin seam's anchors match built section ids,
# no PDF bytes are committed, and the `pdf_public` gate withholds and publishes
# correctly. Its own docs cite it in six places as the guard for those. No
# workflow ran it. A `pdf_public: true` with no file in `_site` — row 2 of the
# verifier's own table, the case its docs call "better a loud red than a
# 'Download PDF' button that 404s" — shipped to production, because the loud
# red existed only on a developer's shell.
#
# WHY THIS IS A PLATFORM SEAM AND NOT A CONSUMER WORKFLOW. The consumer cannot
# own a `verify-build.yml`: check-platform-pin-consistency.js's workflow-SET
# parity flags any caller absent from `examples/site/` as `workflow-set: EXTRA`
# on a REQUIRED check. So the reusable lives here and the thin caller is
# platform-dictated, which is also what lets `platform-bump.yml` seed it into
# every consumer on the next bump (#315).
#
# CONVENTION, NOT CONFIGURATION. There are NO inputs. If the caller's tree has
# `scripts/verify-build-artifacts.rb`, this builds the site and runs it;
# otherwise it prints a notice and succeeds. It always runs the platform's
# `scripts/liquid-escape-lint.rb` over the site's templates. Independently, it runs the fixed
# self-test list (`scripts/test-verify-build-artifacts.rb`) when present, using
# the site's bundle before building, except on a pull request that changes CMS
# content only (the `content` route, e2e/content-route.js): content cannot
# change the verifier, so its self-tests are skipped there and the verifier
# still runs. Both consumers have verifiers; adamdaniel.ai also has verifier
# self-tests. Nothing to misconfigure.
# Generalizing to a non-Ruby verifier is deliberately out of scope: Jekyll
# guarantees Ruby.
#
# JOB SHAPE, dictated by e2e/required-context-cancellable.test.js's four causes
# rather than by taste. The `verify` job does the work and carries the wall;
# the `site-verify` job is a GATE — `needs: verify`, `if: always()`, no
# `timeout-minutes`, no `concurrency` — that translates the work job's result
# into the one context a ruleset can name. A job GitHub kills at its wall
# reports `cancelled`, and a cancelled required context blocks a merge with no
# override (#285 / #289). Same shape `e2e-tests.yml` uses for `e2e / e2e`.
#
# SEQUENCING (the part that can block every consumer's PRs). This context is
# NOT in `ruleset_library.consumer-main.required_status_checks` yet, on
# purpose. Adding it before both consumers publish it blocks every PR on a
# context that never arrives. Order: release + bump so the caller lands →
# confirm `site-verify / site-verify` reports on both consumers → only then add
# it to repo-settings.yml AND reconcile each consumer's cms-automerge-nudge
# `required_contexts` (consumer-automerge-nudge-contexts.test.js holds the two
# equal; platform-bump reconciles them from the manifest).
name: Site verify (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # The WORK job. Everything that can take time or fail for a build reason
  # lives here, under a wall — its conclusion is required by nothing.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The CALLER's tree: the site whose verifier and build are under test.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The pull request's merge commit plus its two parents, which
          # "Decide the route" diffs. Not full history.
          fetch-depth: 2

      - name: Detect the site's verifier and self-tests
        id: detect
        # Presence is the whole contract. A site that has no verifier is not
        # wrong, it has nothing to verify; a site that has one runs it. The
        # path is fixed by convention so there is no input to get wrong.
        run: |
          set -euo pipefail
          if [ -f scripts/verify-build-artifacts.rb ]; then
            echo "verifier=true" >> "$GITHUB_OUTPUT"
            echo "scripts/verify-build-artifacts.rb present — building the site and running it."
          else
            echo "verifier=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=site-verify::No scripts/verify-build-artifacts.rb in this repo — nothing to verify (this is not an error)."
          fi
          if [ -f scripts/test-verify-build-artifacts.rb ]; then
            echo "selftests=true" >> "$GITHUB_OUTPUT"
          else
            echo "selftests=false" >> "$GITHUB_OUTPUT"
          fi

      # The escaping lint is the PLATFORM's script, fetched at the commit this
      # reusable was called at, the way scheduled-run-health.yml fetches its
      # audit (#424): the caller's own synced copy could be stale or edited.
      # `toJSON(job)` because actionlint does not yet type job.workflow_*
      # (rhysd/actionlint#647); values reach the step only through env.
      - name: Resolve the platform commit this reusable was called at
        id: self
        env:
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          set -euo pipefail
          repo=$(jq -r '.workflow_repository // ""' <<<"$JOB_CONTEXT")
          sha=$(jq -r '.workflow_sha // ""' <<<"$JOB_CONTEXT")
          if ! [[ "$repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::the job context carries no usable workflow_repository ('${repo}'); refusing to guess which platform commit to run."
            exit 1
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the job context carries no usable workflow_sha ('${sha}'); refusing to guess which platform commit to run."
            exit 1
          fi
          {
            echo "repository=$repo"
            echo "sha=$sha"
          } >>"$GITHUB_OUTPUT"

      - name: Fetch the escaping lint and the route rule from the platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.self.outputs.repository }}
          ref: ${{ steps.self.outputs.sha }}
          path: .cms-platform
          persist-credentials: false
          # The route rule is content-route.js plus the modules it requires,
          # and the composite that gathers its inputs. The two package.json
          # files are there so Node reads the PLATFORM's module type for
          # those scripts: without them it walks up to the site's own
          # package.json, and a site that sets `"type": "module"` would make
          # the rule fail to load (safely, as `full`, but always).
          sparse-checkout: |
            package.json
            scripts/liquid-escape-lint.rb
            scripts/content-pr-guard.js
            e2e/package.json
            e2e/content-route.js
            e2e/trusted-yaml.js
            e2e/visual-regression-salient.js
            .github/actions/content-route/action.yml
          sparse-checkout-cone-mode: false

      # Pinned: content-route.js runs under node (ubuntu-latest's default
      # Node moves with the runner image).
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "20"

      # A pull request that changes CMS content only skips the verifier's
      # SELF-TESTS below, and nothing else. The self-tests rebuild scratch
      # copies of the site to prove the VERIFIER still tells good edits from
      # real defects; content cannot change the verifier, the layouts or the
      # theme, and on adamdaniel.ai they were over three of this job's seven
      # minutes on every post. The build, the verifier itself and the
      # escaping lint always run: they are the checks that are about the
      # content. Every doubt is `full` (the action's header).
      - name: Decide the route
        id: route
        uses: ./.cms-platform/.github/actions/content-route
        with:
          # Renders "true"/"false", never branch text.
          from-cms: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'cms/') }}
          # A commit id, checked against the merge commit's second parent.
          head-sha: ${{ github.event.pull_request.head.sha }}

      # Unconditional: the escaping lint runs on every site, and it parses
      # with the site bundle's `liquid` gem.
      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199
        with:
          # Tracks deploy-preview.yml's `ruby_version` default, so the tree
          # this verifies is built by the same Ruby that builds the deploys.
          # e2e/site-verify.test.js holds the two equal.
          ruby-version: "3.2"
          bundler-cache: true

      - name: Run the site's verifier self-tests
        if: steps.route.outputs.route != 'content'
        run: |
          set -euo pipefail
          found=false
          for script in scripts/test-verify-build-artifacts.rb; do
            if [ -f "$script" ]; then
              found=true
              bundle exec ruby "$script"
            fi
          done
          if [ "$found" = false ]; then
            echo "::notice title=site-verify::No verifier self-test script in this repo — skipping self-tests (this is not an error)."
          fi

      - name: Build the site
        if: steps.detect.outputs.verifier == 'true'
        env:
          # The verifier asserts on what SHIPS. deploy-production.yml builds
          # under `production`, so this does too.
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Run the site's verifier
        if: steps.detect.outputs.verifier == 'true'
        # The script's own contract: `ok`/`FAIL` per assertion, exit 1 on any
        # FAIL. Its output is the finding; nothing here re-summarises it.
        #
        # SITE_VERIFY_SELF_TESTS_HANDLED tells a verifier whose default
        # entrypoint ALSO runs its self-tests (adamdaniel.ai's does, so a bare
        # local run proves both) that this job has already dealt with them:
        # the step above ran them, or the content route decided they are not
        # needed. Without it that site ran its regression matrix twice per
        # pull request, and once on a post that skips it. A verifier that
        # does not know the variable ignores it.
        env:
          SITE_VERIFY_SELF_TESTS_HANDLED: "true"
        run: ruby scripts/verify-build-artifacts.rb

      - name: Lint Liquid output escaping
        # Every `{{ ... }}` in the site's HTML/XML templates must end in a
        # filter that encodes for where it prints (_agent-guidance#467). The
        # pre-commit hook (delivered by dev-hooks-sync.yml) runs the same
        # script on staged files; this is the gate, since a hook can be
        # skipped. A site's reasoned exceptions live in its own
        # `.liquid-escape-allowlist.txt`.
        run: bundle exec ruby .cms-platform/scripts/liquid-escape-lint.rb --all .

  # The GATE. This is the job a ruleset names (`site-verify / site-verify`
  # through the dictated caller). It carries NO `timeout-minutes` and NO
  # `concurrency`: being unkillable-at-a-wall is its entire job. `if: always()`
  # so a failed or cancelled `verify` still produces a RED here rather than a
  # skip that hangs the PR on "Waiting for status to be reported".
  site-verify:
    needs: verify
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Gate on the verify job
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          set -euo pipefail
          echo "verify job result: ${VERIFY_RESULT}"
          if [ "${VERIFY_RESULT}" != "success" ]; then
            echo "::error::The site's post-build verifier did not succeed (${VERIFY_RESULT}) — see the verify job above for the failing assertion(s)."
            exit 1
          fi
          echo "Site verifier passed (or the site has none)."
