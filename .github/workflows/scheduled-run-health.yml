# Scheduled-run + default-branch-push health audit (reusable).
#
# THE PROBLEM (2026-07 workflow audit): scheduled workflows fail SILENTLY —
# an `event=schedule` failure has no PR to go red on and fires no
# notification, so it is invisible outside the Actions tab. Observed live:
# adamdaniel.ai's daily editorial-label-audit was red 24/30 days for three
# weeks unnoticed; jodidaniel.com's sweep-stale-cms-prs startup-failed 30/30
# for a month (a dropped `secrets:` map) before anyone looked.
#
# THE FIX: a daily audit that scans the CALLER repo's workflow runs from the
# last `window_hours` (default 48) for `event=schedule` conclusions of
# failure / startup_failure / timed_out and opens-or-updates a SINGLE
# tracking issue (label `ci`, found via a hidden marker): open on first
# failure (the issue notification is the alert), comment only NEW failing
# runs (dedupe by run id), auto-close after a clean window. Zero changes to
# the ~10 existing scheduled callers — they stay untouched; this watches
# them all from the outside. The 48h window is deliberate: GitHub throttles
# crons on these repos (daily crons measured 4-5h late), so two daily audit
# runs can be ~29h apart — a 24h window would leave a blind gap.
#
# THE SAME BLIND SPOT HITS `event=push` ON THE DEFAULT BRANCH (#279): a push
# to `main` has no PR to go red on either. Live incident, 2026-08: a
# `.gitleaks.toml` change on adamdaniel.ai passed its PR check but broke 8
# CONSECUTIVE `push`-to-`main` runs of `secrets-scan.yml`, each one a blocked
# Decap editorial publish, with no tracking issue ever filed. `push_scan`
# (default TRUE — see below) adds that lane to the same audit.
#
# The audit run itself stays GREEN when it successfully files/updates the
# alert (the ISSUE is the alert channel); it goes red only when it could not
# do its job (API/permission failure) — "red means the alerting layer needs
# a human", the same contract as editorial-label-audit's fix mode. The audit
# is itself scheduled, and its own failed runs are scheduled failures the
# NEXT day's run reports — the watcher is watched.
name: Scheduled-run health audit (reusable)

on:
  workflow_call:
    inputs:
      platform_repo: { type: string, default: Adam-S-Daniel/cms-platform }
      platform_ref:  { type: string, default: main }
      # Scan window in hours. String (not number) so thin callers can wire a
      # workflow_dispatch input straight through without type coercion.
      window_hours:  { type: string, default: "48" }
      issue_label:   { type: string, default: "ci" }
      dry_run:       { type: boolean, default: false }
      # Default TRUE, deliberately: an opt-in-off flag would leave exactly the
      # repos that need this — busy, bot-automated ones — uncovered until
      # someone remembers to flip it, the same "silence reads as health"
      # failure this audit exists to close.
      push_scan:     { type: boolean, default: true }
      # THE STALENESS LANE (#313). Days without a SUCCESS before a scheduled
      # workflow is reported. String for the same reason as window_hours.
      # Default TRUE / on, for the same reason push_scan is: the repos that
      # most need this are the ones nobody would remember to flip it for.
      stale_days:    { type: string, default: "14" }
      stale_scan:    { type: boolean, default: true }

# Reusable-workflow permissions are capped by the CALLER's grant: the caller
# must give actions: read (list workflow runs) + issues: write (open /
# comment / close the tracking issue) or the audit falls back to failing loud.
permissions:
  contents: read
  actions: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch the audit script from the platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.platform_repo }}
          ref: ${{ inputs.platform_ref }}
          sparse-checkout: scripts/audit-scheduled-runs.js
          sparse-checkout-cone-mode: false
          path: .cms-platform
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
      - name: Audit scheduled-run health
        # Build every conditional flag in SHELL from env, never inline with an
        # `a && b || c` expression. That form is not a ternary: it is two
        # operators, and GitHub returns `c` whenever `b` is falsy — and an EMPTY
        # STRING is falsy. The push-scan flag was written that way with the empty
        # string on the truthy side, so it emitted its opt-out UNCONDITIONALLY.
        # Measured on run 32280743541: dispatched with push_scan=true, it skipped
        # the push scan entirely and still printed "0 failing push run(s)" from
        # the static default rather than from any API call. A silent no-op that
        # reports healthy is worse than a crash — nothing goes red, so nothing
        # draws attention. The neighbouring dry-run flag survived only because
        # its truthy branch was a non-empty string.
        # e2e/expression-empty-truthy-branch.test.js now fails the build on it.
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_REPO: ${{ github.repository }}
          AUDIT_WINDOW_HOURS: ${{ inputs.window_hours }}
          AUDIT_LABEL: ${{ inputs.issue_label }}
          AUDIT_DRY_RUN: ${{ inputs.dry_run }}
          AUDIT_PUSH_SCAN: ${{ inputs.push_scan }}
          AUDIT_STALE_DAYS: ${{ inputs.stale_days }}
          AUDIT_STALE_SCAN: ${{ inputs.stale_scan }}
        run: |
          # Pass the caller's repo explicitly: the reusable only SPARSE-checks-out
          # the audit script (no consumer checkout), so github.workspace is not a
          # git repo and gh could not infer the repo from a local remote (the
          # editorial-label-audit v0.1.16 trap).
          #
          # Flags are built here in shell from env, never inline in an expression
          # — see the note above this step. `if` blocks, not
          # `[[ ... ]] && args+=(...)`: GitHub runs `run:` under `bash -e`, so a
          # false `[[ ]]` as the last statement would exit the step 1.
          args=(--repo "$AUDIT_REPO" --window-hours "$AUDIT_WINDOW_HOURS" --label "$AUDIT_LABEL")
          if [[ "$AUDIT_DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          if [[ "$AUDIT_PUSH_SCAN" != "true" ]]; then args+=(--no-push-scan); fi
          args+=(--stale-days "$AUDIT_STALE_DAYS")
          if [[ "$AUDIT_STALE_SCAN" != "true" ]]; then args+=(--no-stale-scan); fi
          node .cms-platform/scripts/audit-scheduled-runs.js "${args[@]}"
