# Reusable down-sync of the platform's canonical pre-commit guard files into a
# consuming site. A site calls this on a schedule (or dispatch); it opens a PR
# when the site's guard files drift from the platform at the pinned ref.
# Platform-authoritative: each listed file is overwritten to match the platform
# exactly. Centralizes the secrets-scan + lint-staged pre-commit guards so every
# consumer (and every future scaffolded site) carries the same checks (issue #116).
name: Dev-hooks sync (reusable)

on:
  workflow_call:
    inputs:
      platform_repo:
        type: string
        default: Adam-S-Daniel/cms-platform
      platform_ref:
        type: string
        default: main
    secrets:
      gh_token:
        description: "Optional PAT (CMS_PLATFORM_PAT) so the sync PR can trigger CI; the fallback when no App is provisioned."
        required: false
      app_private_key:
        description: "Optional: the CMS automation GitHub App's private key (with vars.CMS_AUTOMATION_APP_ID on the caller). Wins over gh_token when set (#238)."
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fetch platform guard files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.platform_repo }}
          ref: ${{ inputs.platform_ref }}
          path: .cms-platform
      # Credential for the PR, resolved App → PAT → GITHUB_TOKEN (#238). The
      # branch push itself rides the checkout's own GITHUB_TOKEN (no workflow
      # file is written here); what needs a non-GITHUB_TOKEN identity is the
      # `gh pr create`, so the PR's `opened` event fires the site's CI. The
      # script is already on disk from the platform checkout above, so this
      # mints from `.cms-platform/scripts/` at the pinned platform_ref — and
      # a ref that predates the script means a reusable that predates this
      # step, so the guard below is belt-and-braces, not a live branch.
      - name: Mint a GitHub App installation token (when the App is provisioned)
        id: app
        env:
          APP_CLIENT_ID: ${{ vars.CMS_AUTOMATION_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.app_private_key }}
        run: |
          set -euo pipefail
          if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::notice::No CMS automation App on this repo (vars.CMS_AUTOMATION_APP_ID + secrets.CMS_AUTOMATION_APP_PRIVATE_KEY) — opening the PR on the caller's gh_token (CMS_PLATFORM_PAT) instead."
            exit 0
          fi
          if [ ! -f .cms-platform/scripts/mint-app-token.js ]; then
            echo "::warning::.cms-platform/scripts/mint-app-token.js missing at this platform_ref — falling back to gh_token."
            exit 0
          fi
          # Scoped DOWN: this one repo, PR write + the contents read `gh pr
          # create` needs. No workflows permission — nothing here writes one.
          node .cms-platform/scripts/mint-app-token.js \
            --owner "${GITHUB_REPOSITORY%%/*}" --repo "${GITHUB_REPOSITORY#*/}" \
            --repositories "${GITHUB_REPOSITORY#*/}" \
            --permissions contents=read,pull_requests=write
      - name: Sync guard files and open a PR if changed
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.gh_token || github.token }}
          REF: ${{ inputs.platform_ref }}
          PLATFORM: ${{ inputs.platform_repo }}
        run: |
          set -euo pipefail
          # Canonical pre-commit guard files (platform-authoritative). Keep this
          # list in lockstep with scaffold/create-site.js + .gitconfig-fragment.
          FILES=(
            scripts/secrets-scan.sh
            scripts/lint-staged.sh
            scripts/setup-hooks.sh
            .githooks/pre-commit
            .gitconfig-fragment
          )
          for f in "${FILES[@]}"; do
            src=".cms-platform/$f"
            if [[ ! -f "$src" ]]; then
              echo "::error::canonical $f missing in ${PLATFORM}@${REF}"; exit 1
            fi
            mkdir -p "$(dirname "$f")"
            cp "$src" "$f"
          done
          chmod +x scripts/secrets-scan.sh scripts/lint-staged.sh scripts/setup-hooks.sh .githooks/pre-commit
          rm -rf .cms-platform
          if git diff --quiet -- "${FILES[@]}"; then
            echo "dev-hooks already in sync with ${PLATFORM}@${REF}"; exit 0
          fi
          BRANCH="platform/dev-hooks-sync"
          git config user.name  "cms-platform-bot"
          git config user.email "cms-platform-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "${FILES[@]}"
          git commit -m "chore: sync pre-commit guard files from ${PLATFORM}@${REF}"
          git push -f origin "$BRANCH"
          gh pr create --base "$GITHUB_REF_NAME" --head "$BRANCH" \
            --title "Sync pre-commit guards from ${PLATFORM}@${REF}" \
            --body "Automated dev-hooks sync from \`${PLATFORM}@${REF}\`. Platform-authoritative: secrets-scan + lint-staged + the local-wiring setup-hooks.sh." \
          || gh pr edit "$BRANCH" --title "Sync pre-commit guards from ${PLATFORM}@${REF}" \
            --body "Automated dev-hooks sync from \`${PLATFORM}@${REF}\`."
